name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arc-zip-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/ArcZipWindows/ArcZipWindows.csproj
      - name: Build application
        run: dotnet build src/ArcZipWindows/ArcZipWindows.csproj --configuration Release --no-restore
      - name: Run ZIP and local API smoke tests
        run: dotnet run --project tests/ArcZipWindows.SmokeTests/ArcZipWindows.SmokeTests.csproj --configuration Release
      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/ArcZipWindows/ArcZipWindows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/ArcZipWindows-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ArcZip-Windows-win-x64
          path: artifacts/ArcZipWindows-win-x64/
          if-no-files-found: error
          retention-days: 14
      - name: Publish self-contained Windows x86 (32-bit) app
        run: dotnet publish src/ArcZipWindows/ArcZipWindows.csproj --configuration Release --runtime win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/ArcZipWindows-win-x86
      - uses: actions/upload-artifact@v4
        with:
          name: ArcZip-Windows-win-x86
          path: artifacts/ArcZipWindows-win-x86/
          if-no-files-found: error
          retention-days: 14
      - name: Publish self-contained Windows ARM64 app
        run: dotnet publish src/ArcZipWindows/ArcZipWindows.csproj --configuration Release --runtime win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/ArcZipWindows-win-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ArcZip-Windows-win-arm64
          path: artifacts/ArcZipWindows-win-arm64/
          if-no-files-found: error
          retention-days: 14
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\ArcZipWindows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ArcZip-Windows-Installer
          path: artifacts/ArcZip-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 14
